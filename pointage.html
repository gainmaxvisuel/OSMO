<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OSMO — Pointage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#05030a;
      --card:#0d0815;
      --card2:#120b1d;
      --purple:#7c3aed;
      --purple2:#a855f7;
      --text:#ffffff;
      --muted:#9b94a8;
      --border:rgba(168,85,247,.18);
      --success:#22c55e;
      --danger:#ef4444;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(124,58,237,.16), transparent 35%),
        var(--bg);
      color:var(--text);
      font-family:Inter,Arial,sans-serif;
      padding-bottom:90px;
    }

    .page{
      width:100%;
      max-width:520px;
      margin:auto;
      padding:20px 16px;
    }

    .top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:24px;
    }

    .back{
      width:42px;
      height:42px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(124,58,237,.08);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:21px;
    }

    .logo{
      width:42px;
      height:42px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid var(--border);
    }

    .title-box h1{
      font-size:20px;
      font-weight:800;
    }

    .title-box p{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(145deg,rgba(124,58,237,.22),rgba(168,85,247,.04)),
        var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px 20px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.3);
    }

    .hero::before{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      background:rgba(124,58,237,.12);
      filter:blur(35px);
      top:-90px;
      left:50%;
      transform:translateX(-50%);
    }

    .check-icon{
      position:relative;
      width:72px;
      height:72px;
      margin:0 auto 20px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,#7c3aed,#a855f7);
      box-shadow:0 15px 35px rgba(124,58,237,.3);
      font-size:30px;
      font-weight:800;
    }

    .hero h2{
      position:relative;
      font-size:23px;
      font-weight:800;
    }

    .hero-text{
      position:relative;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      margin:10px auto 24px;
      max-width:350px;
    }

    .amount-label{
      color:var(--muted);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .amount{
      margin-top:6px;
      font-size:38px;
      font-weight:800;
      background:linear-gradient(90deg,#fff,#c084fc);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .amount span{
      font-size:17px;
      margin-left:4px;
    }

    .claim{
      width:100%;
      margin-top:25px;
      height:52px;
      border:0;
      border-radius:15px;
      background:linear-gradient(135deg,#7c3aed,#9333ea);
      color:white;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 12px 25px rgba(124,58,237,.25);
      transition:.2s;
    }

    .claim:active{
      transform:scale(.98);
    }

    .claim:disabled{
      cursor:not-allowed;
      background:#21182b;
      color:#7f778a;
      box-shadow:none;
    }

    .status{
      margin-top:15px;
      min-height:20px;
      font-size:12px;
      line-height:1.5;
    }

    .status.success{
      color:var(--success);
    }

    .status.error{
      color:var(--danger);
    }

    .info{
      margin-top:16px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .info-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
    }

    .info-card .label{
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .info-card strong{
      display:block;
      margin-top:7px;
      font-size:14px;
    }

    .bottom-nav{
      position:fixed;
      z-index:20;
      bottom:0;
      left:0;
      right:0;
      height:72px;
      background:rgba(7,4,12,.96);
      backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
      display:flex;
      justify-content:center;
    }

    .nav-inner{
      width:100%;
      max-width:520px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
    }

    .nav-item{
      text-decoration:none;
      color:#81798c;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:10px;
      font-weight:700;
    }

    .nav-icon{
      font-size:19px;
      line-height:1;
    }

    .nav-item.active{
      color:#a855f7;
    }

    .loading{
      opacity:.6;
      pointer-events:none;
    }

    .toast{
      position:fixed;
      z-index:50;
      left:16px;
      right:16px;
      bottom:88px;
      max-width:488px;
      margin:auto;
      padding:14px 16px;
      border-radius:14px;
      background:#160d20;
      border:1px solid var(--border);
      color:white;
      font-size:12px;
      text-align:center;
      transform:translateY(20px);
      opacity:0;
      pointer-events:none;
      transition:.25s;
    }

    .toast.show{
      transform:translateY(0);
      opacity:1;
    }

    @media(max-width:380px){
      .amount{
        font-size:34px;
      }

      .hero{
        padding:25px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">
      <a href="dashboard.html" class="back">‹</a>

      <img
        src="logo.png"
        alt="OSMO"
        class="logo"
      >

      <div class="title-box">
        <h1>Pointage quotidien</h1>
        <p>Réclamez votre récompense quotidienne</p>
      </div>
    </header>

    <section class="hero">

      <div class="check-icon">✓</div>

      <h2>Votre pointage du jour</h2>

      <p class="hero-text">
        Effectuez votre pointage quotidien pour recevoir automatiquement
        votre récompense sur votre solde OSMO.
      </p>

      <div class="amount-label">Récompense</div>

      <div class="amount">
        <span id="amount">50</span>
        <span>XOF</span>
      </div>

      <button id="claimBtn" class="claim">
        RÉCLAMER
      </button>

      <div id="status" class="status"></div>

    </section>

    <section class="info">

      <div class="info-card">
        <div class="label">Fréquence</div>
        <strong>1 fois / jour</strong>
      </div>

      <div class="info-card">
        <div class="label">Statut</div>
        <strong id="dailyStatus">Disponible</strong>
      </div>

    </section>

  </main>

  <nav class="bottom-nav">
    <div class="nav-inner">

      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">⌂</span>
        <span>ACCUEIL</span>
      </a>

      <a href="produits.html" class="nav-item">
        <span class="nav-icon">▣</span>
        <span>PRODUIT</span>
      </a>

      <a href="equipe.html" class="nav-item">
        <span class="nav-icon">♧</span>
        <span>ÉQUIPE</span>
      </a>

      <a href="compte.html" class="nav-item">
        <span class="nav-icon">◉</span>
        <span>PROFIL</span>
      </a>

    </div>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL =
      "https://ubzcivowwhglvzpyeueg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oPjQfIoZzfv1LuLAfsua4g_97K_tXSO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const sessionToken =
      localStorage.getItem("osmo_session_token");

    const claimBtn =
      document.getElementById("claimBtn");

    const statusEl =
      document.getElementById("status");

    const amountEl =
      document.getElementById("amount");

    const dailyStatus =
      document.getElementById("dailyStatus");

    const toast =
      document.getElementById("toast");

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function setStatus(message, type){
      statusEl.textContent = message;
      statusEl.className = "status " + type;
    }

    async function loadSettings(){

      const { data, error } =
        await supabaseClient.rpc(
          "public_settings"
        );

      if(error){
        console.error(error);
        return;
      }

      const amount =
        Number(data?.daily_checkin_amount ?? 50);

      amountEl.textContent =
        amount.toLocaleString("fr-FR");

    }

    async function checkToday(){

      if(!sessionToken){
        window.location.href =
          "connexion.html";
        return;
      }

      const { data, error } =
        await supabaseClient
          .from("daily_checkins")
          .select("id, amount, checkin_date")
          .eq("checkin_date", new Date().toISOString().slice(0,10))
          .limit(1);

      /*
        La table est protégée par RLS.
        Si la ligne n'est pas accessible côté client,
        on laisse le RPC décider au moment de la réclamation.
      */

      if(error){
        console.log("Vérification directe indisponible:", error.message);
        return;
      }

      if(data && data.length > 0){

        claimBtn.disabled = true;
        claimBtn.textContent =
          "DÉJÀ RÉCLAMÉ";

        dailyStatus.textContent =
          "Réclamé aujourd’hui";

        setStatus(
          "Votre pointage a déjà été réclamé aujourd’hui.",
          "success"
        );
      }
    }

    async function claim(){

      if(!sessionToken){
        window.location.href =
          "connexion.html";
        return;
      }

      claimBtn.disabled = true;
      claimBtn.classList.add("loading");
      claimBtn.textContent =
        "TRAITEMENT...";

      setStatus("", "");

      const { data, error } =
        await supabaseClient.rpc(
          "claim_daily_checkin",
          {
            p_session_token: sessionToken
          }
        );

      claimBtn.classList.remove("loading");

      if(error){

        console.error(error);

        claimBtn.disabled = false;
        claimBtn.textContent =
          "RÉCLAMER";

        setStatus(
          "Une erreur est survenue. Veuillez réessayer.",
          "error"
        );

        showToast("Erreur lors du pointage.");
        return;
      }

      if(!data?.success){

        claimBtn.disabled = true;
        claimBtn.textContent =
          "DÉJÀ RÉCLAMÉ";

        dailyStatus.textContent =
          "Réclamé aujourd’hui";

        setStatus(
          data?.message ||
          "Le pointage a déjà été réclamé aujourd’hui.",
          "error"
        );

        return;
      }

      claimBtn.disabled = true;
      claimBtn.textContent =
        "DÉJÀ RÉCLAMÉ";

      dailyStatus.textContent =
        "Réclamé aujourd’hui";

      setStatus(
        data.message ||
        "Pointage réclamé avec succès.",
        "success"
      );

      showToast(
        "+" +
        Number(data.amount || 0)
          .toLocaleString("fr-FR") +
        " XOF ajoutés à votre solde."
      );

    }

    claimBtn.addEventListener(
      "click",
      claim
    );

    async function init(){

      await loadSettings();

      await checkToday();

    }

    init();

  </script>

</body>
  </html>
