<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OSMO — Produits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #050507;
      --panel: #0d0b12;
      --panel-2: #12101a;
      --border: rgba(148, 77, 255, 0.18);
      --purple: #8b3dff;
      --purple-light: #a86cff;
      --text: #ffffff;
      --muted: #96909f;
      --green: #20d49b;
      --danger: #ff5c75;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(116, 37, 255, 0.20), transparent 32%),
        var(--black);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
    }

    button,
    a {
      font-family: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 30px;
    }

    /* HEADER */

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: contain;
      background: #09070d;
      border: 1px solid var(--border);
      padding: 5px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .page-title {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* SUMMARY */

    .summary-card {
      position: relative;
      overflow: hidden;
      min-height: 145px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(105, 38, 220, 0.18), rgba(13, 11, 18, 0.96) 60%),
        var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.30);
      margin-bottom: 30px;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -75px;
      top: -85px;
      border-radius: 50%;
      background: rgba(139, 61, 255, 0.13);
      filter: blur(3px);
    }

    .summary-image {
      position: absolute;
      right: 17px;
      top: 17px;
      width: 58px;
      height: 58px;
      border-radius: 15px;
      object-fit: cover;
      border: 1px solid rgba(168, 108, 255, 0.35);
      opacity: 0.9;
    }

    .summary-content {
      position: relative;
      z-index: 2;
      padding: 22px 18px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 8px;
    }

    .summary-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .product-count {
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
    }

    .summary-arrow {
      width: 29px;
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      background: rgba(139, 61, 255, 0.18);
      border: 1px solid rgba(139, 61, 255, 0.35);
      transition: 0.2s ease;
    }

    .summary-arrow:active {
      transform: scale(0.94);
      background: rgba(139, 61, 255, 0.30);
    }

    .summary-bottom {
      margin-top: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 15px;
    }

    .summary-stat {
      flex: 1;
    }

    .summary-stat-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .summary-stat-value {
      font-size: 17px;
      font-weight: 700;
    }

    .summary-stat-value span {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 3px;
    }

    /* SECTION */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .section-line {
      height: 1px;
      flex: 1;
      margin-left: 13px;
      background: linear-gradient(
        90deg,
        rgba(139, 61, 255, 0.35),
        transparent
      );
    }

    /* PRODUCTS */

    .products-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .product-card {
      overflow: hidden;
      border-radius: 19px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.24);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      height: 190px;
      background: #0a090d;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .market-badge {
      position: absolute;
      left: 13px;
      top: 13px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(5, 5, 7, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(8px);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #e5d9ff;
    }

    .product-content {
      padding: 16px;
    }

    .product-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .product-price {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 800;
      color: var(--purple-light);
    }

    .product-price small {
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 2px;
    }

    .product-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 15px;
    }

    .detail {
      padding: 10px 8px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .detail-label {
      font-size: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 11px;
      font-weight: 700;
    }

    .buy-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px 15px;
      color: white;
      background: linear-gradient(135deg, #7627df, #9d4cff);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 9px 25px rgba(124, 42, 230, 0.18);
    }

    .buy-button:active {
      transform: scale(0.98);
    }

    .buy-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .buy-button i {
      margin-right: 7px;
    }

    /* EMPTY / LOADING */

    .state-box {
      padding: 30px 18px;
      text-align: center;
      border-radius: 17px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
    }

    .state-box i {
      display: block;
      margin-bottom: 10px;
      font-size: 22px;
      color: var(--purple-light);
    }

    /* BOTTOM MENU */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 560px;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: rgba(7, 6, 10, 0.95);
      backdrop-filter: blur(18px);
      border-top: 1px solid rgba(139, 61, 255, 0.15);
    }

    .nav-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 52px;
      color: #77717f;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-radius: 11px;
      transition: 0.2s ease;
    }

    .nav-item i {
      font-size: 16px;
    }

    .nav-item.active {
      color: #b77cff;
      background: rgba(139, 61, 255, 0.08);
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(7px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      border-radius: 20px;
      padding: 22px;
      background:
        linear-gradient(145deg, rgba(91, 35, 169, 0.16), transparent 48%),
        #100d15;
      border: 1px solid rgba(139, 61, 255, 0.28);
      box-shadow: 0 25px 70px rgba(0,0,0,0.55);
      animation: modalIn 0.18s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      margin-bottom: 15px;
      background: rgba(139, 61, 255, 0.13);
      border: 1px solid rgba(139, 61, 255, 0.25);
      color: var(--purple-light);
      font-size: 18px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .modal-text {
      color: #aaa3b1;
      font-size: 12px;
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .modal-product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 11px;
      background: #0b0910;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .modal-product-name {
      font-size: 12px;
      font-weight: 700;
    }

    .modal-product-price {
      color: var(--purple-light);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .modal-button {
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
    }

    .cancel-button {
      color: #aaa3b1;
      background: #19151f;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .confirm-button {
      color: white;
      background: linear-gradient(135deg, #7627df, #9d4cff);
    }

    .modal-message {
      display: none;
      padding: 11px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.5;
    }

    .modal-message.error {
      display: block;
      color: #ffb3bd;
      background: rgba(255, 70, 95, 0.08);
      border: 1px solid rgba(255, 70, 95, 0.16);
    }

    .modal-message.success {
      display: block;
      color: #9ef0d0;
      background: rgba(32, 212, 155, 0.08);
      border: 1px solid rgba(32, 212, 155, 0.16);
    }

    @media (min-width: 500px) {
      .product-image-wrap {
        height: 220px;
      }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL =
      "https://ubzcivowwhglvzpyeueg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oPjQfIoZzfv1LuLAfsua4g_97K_tXSO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const sessionToken =
      localStorage.getItem("osmo_session_token");

    const investmentsContainer =
      document.getElementById("investments");

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("errorBox");

    const totalProducts =
      document.getElementById("totalProducts");

    const totalGenerated =
      document.getElementById("totalGenerated");

    const investmentCount =
      document.getElementById("investmentCount");

    function formatMoney(value) {
      return new Intl.NumberFormat("fr-FR").format(
        Number(value || 0)
      );
    }

    function formatDate(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "—";
      }

      return date.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function getStatus(status) {
      if (status === "completed") {
        return {
          text: "TERMINÉ",
          className: "completed"
        };
      }

      if (status === "cancelled") {
        return {
          text: "ANNULÉ",
          className: "cancelled"
        };
      }

      return {
        text: "EN COURS",
        className: "running"
      };
    }

    function calculateProgress(item) {
      const cycle = Number(item.days_paid || 0);
      const end = Number(item.total_income || 0);
      const daily = Number(item.daily_income || 0);

      if (item.status === "completed") {
        return 100;
      }

      if (daily <= 0 || end <= 0) {
        return 0;
      }

      const expectedDays = Math.max(
        1,
        Math.round(end / daily)
      );

      return Math.min(
        100,
        Math.max(
          0,
          Math.round((cycle / expectedDays) * 100)
        )
      );
    }

    function getDaysTotal(item) {
      const daily = Number(item.daily_income || 0);
      const total = Number(item.total_income || 0);

      if (daily <= 0) {
        return 0;
      }

      return Math.max(
        1,
        Math.round(total / daily)
      );
    }

    function createInvestmentCard(item, productMap) {

      const product =
        productMap[String(item.product_id)] || {};

      const productName =
        product.name || "Produit OSMO";

      const generated =
        Number(item.generated_income || 0);

      const daily =
        Number(item.daily_income || 0);

      const total =
        Number(item.total_income || 0);

      const purchase =
        Number(item.purchase_price || 0);

      const daysPaid =
        Number(item.days_paid || 0);

      const totalDays =
        getDaysTotal(item);

      const progress =
        calculateProgress(item);

      const status =
        getStatus(item.status);

      const card =
        document.createElement("article");

      card.className = "investment-card";

      card.innerHTML = `
        <div class="product-head">

          <img
            src="product.jpg"
            class="product-image"
            alt="${productName}"
          >

          <div class="product-info">
            <div class="product-name">
              ${productName}
            </div>

            <div class="product-date">
              Achat le ${formatDate(item.created_at)}
            </div>
          </div>

          <div class="status ${status.className}">
            ${status.text}
          </div>

        </div>

        <div class="progress-header">
          <span class="progress-label">
            Progression
          </span>

          <span class="progress-percent">
            ${progress}%
          </span>
        </div>

        <div class="progress-track">
          <div
            class="progress-bar"
            style="width:${progress}%"
          ></div>
        </div>

        <div class="data-grid">

          <div class="data-item">
            <div class="data-label">
              Montant investi
            </div>

            <div class="data-value">
              ${formatMoney(purchase)} XOF
            </div>
          </div>

          <div class="data-item">
            <div class="data-label">
              Revenu quotidien
            </div>

            <div class="data-value purple">
              ${formatMoney(daily)} XOF
            </div>
          </div>

          <div class="data-item">
            <div class="data-label">
              Revenu total prévu
            </div>

            <div class="data-value">
              ${formatMoney(total)} XOF
            </div>
          </div>

          <div class="data-item">
            <div class="data-label">
              Durée
            </div>

            <div class="data-value">
              ${daysPaid} / ${totalDays} jours
            </div>
          </div>

        </div>

        <div class="investment-footer">

          <div class="generated">
            <span class="generated-label">
              Revenus déjà générés
            </span>

            <div class="generated-value">
              ${formatMoney(generated)}
              <span>XOF</span>
            </div>
          </div>

          <div class="next-income">
            ${
              item.status === "running"
                ? `
                  Prochain revenu
                  <strong>
                    ${formatDate(item.next_income_at)}
                  </strong>
                `
                : `
                  Fin de l'investissement
                  <strong>
                    ${formatDate(item.end_at)}
                  </strong>
                `
            }
          </div>

        </div>
      `;

      return card;
    }

    function showEmpty() {

      investmentsContainer.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            <i class="fa-solid fa-chart-line"></i>
          </div>

          <h3>Aucun investissement</h3>

          <p>
            Vous n'avez pas encore acheté de produit.
            Découvrez les produits disponibles sur le marché OSMO.
          </p>

          <a
            href="produits.html"
            class="empty-btn"
          >
            <i class="fa-solid fa-box"></i>
            Voir les produits
          </a>

        </div>
      `;
    }

    async function loadInvestments() {

      if (!sessionToken) {
        window.location.href = "connexion.html";
        return;
      }

      try {

        const [
          investmentsResponse,
          productsResponse
        ] = await Promise.all([

          supabaseClient.rpc(
            "user_products",
            {
              p_session_token: sessionToken
            }
          ),

          supabaseClient.rpc(
            "public_products"
          )

        ]);

        if (investmentsResponse.error) {
          throw investmentsResponse.error;
        }

        if (productsResponse.error) {
          throw productsResponse.error;
        }

        const investments =
          investmentsResponse.data || [];

        const products =
          productsResponse.data || [];

        const productMap = {};

        products.forEach(product => {
          productMap[String(product.id)] =
            product;
        });

        loading.style.display = "none";

        totalProducts.textContent =
          investments.length;

        investmentCount.textContent =
          `${investments.length} ${
            investments.length > 1
              ? "investissements"
              : "investissement"
          }`;

        const generatedTotal =
          investments.reduce(
            (sum, item) =>
              sum + Number(item.generated_income || 0),
            0
          );

        totalGenerated.textContent =
          formatMoney(generatedTotal);

        if (investments.length === 0) {
          showEmpty();
          return;
        }

        investmentsContainer.innerHTML = "";

        investments.forEach(item => {

          investmentsContainer.appendChild(
            createInvestmentCard(
              item,
              productMap
            )
          );

        });

      } catch (error) {

        console.error(
          "Erreur investissements:",
          error
        );

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Impossible de charger vos investissements. Veuillez réessayer.";

      }
    }

    loadInvestments();
  </script>

</body>
</html>
