<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OSMO — Mes investissements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #050507;
      --card: #101016;
      --card2: #15151d;
      --purple: #7c3aed;
      --purple2: #9333ea;
      --violet: #a855f7;
      --white: #ffffff;
      --muted: #92929f;
      --border: rgba(168, 85, 247, .16);
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(124, 58, 237, .22),
          transparent 35%
        ),
        var(--black);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 20px 16px 30px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      object-fit: cover;
      border-radius: 13px;
      border: 1px solid rgba(168, 85, 247, .3);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ddd6fe;
      text-decoration: none;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
    }

    /* TITLE */

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .title p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .summary-card {
      min-height: 105px;
      padding: 16px;
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          rgba(124,58,237,.13),
          rgba(255,255,255,.025)
        ),
        var(--card);
      border: 1px solid var(--border);
    }

    .summary-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(124,58,237,.15);
      color: #c4b5fd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 21px;
      font-weight: 800;
    }

    .summary-value small {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    /* SECTION */

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-header h2 {
      font-size: 16px;
      font-weight: 800;
    }

    .section-header span {
      color: var(--muted);
      font-size: 10px;
    }

    /* INVESTMENT */

    .investment {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(124,58,237,.035)
        ),
        var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 13px;
    }

    .investment-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 17px;
    }

    .product-image {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(168,85,247,.18);
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .purchase-date {
      color: var(--muted);
      font-size: 10px;
    }

    .status {
      flex-shrink: 0;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
    }

    .status-running {
      color: #86efac;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.18);
    }

    .status-completed {
      color: #d8b4fe;
      background: rgba(124,58,237,.12);
      border: 1px solid rgba(124,58,237,.18);
    }

    .status-cancelled {
      color: #fca5a5;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.18);
    }

    /* PROGRESS */

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .progress-label {
      color: var(--muted);
      font-size: 10px;
    }

    .progress-percent {
      color: #c4b5fd;
      font-size: 10px;
      font-weight: 800;
    }

    .progress-track {
      height: 7px;
      width: 100%;
      background: #24242d;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        var(--purple),
        var(--violet)
      );
    }

    /* DATA */

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 20px;
      border-top: 1px solid rgba(255,255,255,.06);
      border-bottom: 1px solid rgba(255,255,255,.06);
      margin: 0 -16px;
      padding: 14px 16px;
    }

    .data-label {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .data-value {
      font-size: 13px;
      font-weight: 700;
    }

    .data-value.purple {
      color: #c4b5fd;
    }

    /* FOOTER */

    .investment-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-top: 14px;
    }

    .generated-label {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .generated-value {
      font-size: 17px;
      font-weight: 800;
    }

    .generated-value small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .date-end {
      text-align: right;
      color: var(--muted);
      font-size: 10px;
    }

    .date-end strong {
      display: block;
      color: #ddd6fe;
      margin-top: 3px;
      font-size: 11px;
    }

    /* EMPTY */

    .empty {
      padding: 40px 20px;
      text-align: center;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      background: rgba(124,58,237,.12);
      border: 1px solid var(--border);
      color: #c4b5fd;
      font-size: 21px;
    }

    .empty h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .empty p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* LOADING */

    .loading {
      padding: 35px 20px;
      text-align: center;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .spinner {
      width: 27px;
      height: 27px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid rgba(168,85,247,.18);
      border-top-color: var(--violet);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      padding: 13px;
      margin-bottom: 15px;
      border-radius: 15px;
      background: rgba(239,68,68,.07);
      border: 1px solid rgba(239,68,68,.18);
      color: #fca5a5;
      font-size: 11px;
    }

    /* BOTTOM MENU */

    .bottom-nav {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 590px;
      height: 68px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: rgba(15,15,21,.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(168,85,247,.17);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      color: #777783;
      border-radius: 15px;
      font-size: 9px;
      font-weight: 600;
    }

    .nav-item i {
      font-size: 16px;
    }

    .nav-item.active {
      color: #d8b4fe;
      background: rgba(124,58,237,.12);
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="brand">
        <img
          src="logo.png"
          class="brand-logo"
          alt="OSMO"
        >

        <div>
          <div class="brand-name">OSMO</div>
          <div class="brand-subtitle">
            Mes investissements
          </div>
        </div>
      </div>

      <a
        href="produits.html"
        class="back-button"
        aria-label="Retour"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </a>

    </header>


    <section class="title">

      <h1>Mes investissements</h1>

      <p>
        Retrouvez ici uniquement les produits que vous avez achetés.
      </p>

    </section>


    <section class="summary">

      <div class="summary-card">

        <div class="summary-icon">
          <i class="fa-solid fa-box"></i>
        </div>

        <div class="summary-label">
          Produits achetés
        </div>

        <div
          class="summary-value"
          id="totalProducts"
        >
          0
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-icon">
          <i class="fa-solid fa-chart-line"></i>
        </div>

        <div class="summary-label">
          Revenus générés
        </div>

        <div class="summary-value">

          <span id="totalGenerated">
            0
          </span>

          <small>XOF</small>

        </div>

      </div>

    </section>


    <div
      class="error"
      id="errorBox"
    ></div>


    <section>

      <div class="section-header">

        <h2>
          Produits achetés
        </h2>

        <span id="investmentCount">
          0 investissement
        </span>

      </div>


      <div
        class="loading"
        id="loading"
      >

        <div class="spinner"></div>

        Chargement de vos investissements...

      </div>


      <div id="investments"></div>

    </section>

  </main>


  <!-- MENU BAS -->

  <nav class="bottom-nav">

    <a
      href="dashboard.html"
      class="nav-item"
    >
      <i class="fa-solid fa-house"></i>
      <span>Accueil</span>
    </a>

    <a
      href="produits.html"
      class="nav-item active"
    >
      <i class="fa-solid fa-box"></i>
      <span>Produit</span>
    </a>

    <a
      href="equipe.html"
      class="nav-item"
    >
      <i class="fa-solid fa-users"></i>
      <span>Équipe</span>
    </a>

    <a
      href="compte.html"
      class="nav-item"
    >
      <i class="fa-solid fa-user"></i>
      <span>Profil</span>
    </a>

  </nav>


  <script>

    const SUPABASE_URL =
      "https://ubzcivowwhglvzpyeueg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oPjQfIoZzfv1LuLAfsua4g_97K_tXSO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const sessionToken =
      localStorage.getItem(
        "osmo_session_token"
      );


    const investmentsContainer =
      document.getElementById(
        "investments"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    const totalProducts =
      document.getElementById(
        "totalProducts"
      );

    const totalGenerated =
      document.getElementById(
        "totalGenerated"
      );

    const investmentCount =
      document.getElementById(
        "investmentCount"
      );


    function money(value) {

      return new Intl.NumberFormat(
        "fr-FR"
      ).format(
        Number(value || 0)
      );

    }


    function date(value) {

      if (!value) return "—";

      const d =
        new Date(value);

      if (
        Number.isNaN(
          d.getTime()
        )
      ) {
        return "—";
      }

      return d.toLocaleDateString(
        "fr-FR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function statusInfo(status) {

      if (status === "completed") {

        return {
          text: "TERMINÉ",
          className: "status-completed"
        };

      }

      if (status === "cancelled") {

        return {
          text: "ANNULÉ",
          className: "status-cancelled"
        };

      }

      return {
        text: "EN COURS",
        className: "status-running"
      };

    }


    function totalDays(item) {

      const daily =
        Number(
          item.daily_income || 0
        );

      const total =
        Number(
          item.total_income || 0
        );

      if (daily <= 0) {
        return 0;
      }

      return Math.max(
        1,
        Math.round(
          total / daily
        )
      );

    }


    function progress(item) {

      if (
        item.status === "completed"
      ) {
        return 100;
      }

      const paid =
        Number(
          item.days_paid || 0
        );

      const days =
        totalDays(item);

      if (days <= 0) {
        return 0;
      }

      return Math.min(
        100,
        Math.max(
          0,
          Math.round(
            (paid / days) * 100
          )
        )
      );

    }


    function createCard(item) {

      /*
       * IMPORTANT :
       * Cette carte est créée uniquement
       * à partir des lignes retournées par
       * user_products(session_token).
       *
       * Donc aucun produit du marché
       * n'est ajouté ici.
       */

      const generated =
        Number(
          item.generated_income || 0
        );

      const purchase =
        Number(
          item.purchase_price || 0
        );

      const daily =
        Number(
          item.daily_income || 0
        );

      const total =
        Number(
          item.total_income || 0
        );

      const paid =
        Number(
          item.days_paid || 0
        );

      const days =
        totalDays(item);

      const percent =
        progress(item);

      const status =
        statusInfo(item.status);


      const card =
        document.createElement(
          "article"
        );

      card.className =
        "investment";


      /*
       * Le nom du produit n'est pas récupéré
       * depuis le marché.
       *
       * user_products retourne product_id.
       * On affiche donc l'identifiant si aucun
       * nom n'est disponible.
       *
       * La page reste ainsi strictement limitée
       * aux achats de l'utilisateur.
       */

      const productName =
        item.product_name ||
        "Produit acheté";


      card.innerHTML = `

        <div class="investment-top">

          <img
            src="product.jpg"
            class="product-image"
            alt="Produit acheté"
          >

          <div class="product-info">

            <div class="product-name">
              ${productName}
            </div>

            <div class="purchase-date">
              Achat le ${date(item.created_at)}
            </div>

          </div>

          <div
            class="status ${status.className}"
          >
            ${status.text}
          </div>

        </div>


        <div class="progress-header">

          <span class="progress-label">
            Progression
          </span>

          <span class="progress-percent">
            ${percent}%
          </span>

        </div>


        <div class="progress-track">

          <div
            class="progress-bar"
            style="width:${percent}%"
          ></div>

        </div>


        <div class="data-grid">

          <div>

            <div class="data-label">
              Montant investi
            </div>

            <div class="data-value">
              ${money(purchase)} XOF
            </div>

          </div>


          <div>

            <div class="data-label">
              Revenu quotidien
            </div>

            <div class="data-value purple">
              ${money(daily)} XOF
            </div>

          </div>


          <div>

            <div class="data-label">
              Revenu total prévu
            </div>

            <div class="data-value">
              ${money(total)} XOF
            </div>

          </div>


          <div>

            <div class="data-label">
              Durée
            </div>

            <div class="data-value">
              ${paid} / ${days} jours
            </div>

          </div>

        </div>


        <div class="investment-bottom">

          <div>

            <div class="generated-label">
              Revenus déjà générés
            </div>

            <div class="generated-value">
              ${money(generated)}
              <small>XOF</small>
            </div>

          </div>


          <div class="date-end">

            ${
              item.status === "running"
                ? "Prochain revenu"
                : "Fin de l'investissement"
            }

            <strong>
              ${
                item.status === "running"
                  ? date(item.next_income_at)
                  : date(item.end_at)
              }
            </strong>

          </div>

        </div>

      `;


      return card;

    }


    function showEmpty() {

      investmentsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            <i class="fa-solid fa-box-open"></i>
          </div>

          <h3>
            Aucun investissement
          </h3>

          <p>
            Vous n'avez encore acheté
            aucun produit.
          </p>

        </div>

      `;

    }


    async function loadInvestments() {

      if (!sessionToken) {

        window.location.href =
          "connexion.html";

        return;

      }


      try {

        /*
         * SEULE SOURCE DES INVESTISSEMENTS :
         *
         * user_products(session_token)
         *
         * Cette fonction retourne uniquement
         * les investissements appartenant
         * à l'utilisateur connecté.
         */

        const { data, error } =
          await supabaseClient.rpc(
            "user_products",
            {
              p_session_token:
                sessionToken
            }
          );


        if (error) {
          throw error;
        }


        const investments =
          data || [];


        loading.style.display =
          "none";


        totalProducts.textContent =
          investments.length;


        investmentCount.textContent =
          `${investments.length} ${
            investments.length > 1
              ? "investissements"
              : "investissement"
          }`;


        const generated =
          investments.reduce(
            (
              sum,
              item
            ) =>
              sum +
              Number(
                item.generated_income || 0
              ),
            0
          );


        totalGenerated.textContent =
          money(generated);


        if (
          investments.length === 0
        ) {

          showEmpty();

          return;

        }


        investmentsContainer.innerHTML =
          "";


        investments.forEach(
          item => {

            investmentsContainer.appendChild(
              createCard(item)
            );

          }
        );


      } catch (error) {

        console.error(
          "Erreur investissements :",
          error
        );


        loading.style.display =
          "none";


        errorBox.style.display =
          "block";


        errorBox.textContent =
          "Impossible de charger vos investissements. Veuillez réessayer.";

      }

    }


    loadInvestments();

  </script>

</body>
</html>
