<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSMO — Inscription</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #06130d;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 34px;
      letter-spacing: 3px;
      color: #d4a317;
    }

    .logo p {
      margin-top: 8px;
      color: #91a99d;
      font-size: 14px;
    }

    .card {
      background: #0a2116;
      border: 1px solid #173d28;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
    }

    h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #91a99d;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d8e4de;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #234d35;
      border-radius: 10px;
      background: #06170e;
      color: #fff;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4a317;
    }

    .phone-box {
      position: relative;
    }

    .prefix {
      position: absolute;
      left: 14px;
      top: 15px;
      color: #d4a317;
      font-weight: 600;
      pointer-events: none;
    }

    .phone-box input {
      padding-left: 57px;
    }

    .ref-box {
      border-color: #806718;
      background: #171707;
    }

    .ref-info {
      color: #d4a317;
      font-size: 12px;
      margin-top: 6px;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: #d4a317;
      color: #07130c;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 7px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .error {
      background: #351313;
      border: 1px solid #743333;
      color: #ffb4b4;
    }

    .success {
      background: #10351f;
      border: 1px solid #286840;
      color: #a8e8bd;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #91a99d;
      font-size: 14px;
    }

    .login a {
      color: #d4a317;
      text-decoration: none;
      font-weight: 600;
    }

    .country {
      display: flex;
      align-items: center;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #234d35;
      border-radius: 10px;
      background: #06170e;
      color: #d8e4de;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>OSMO</h1>
    <p>Plateforme d'investissement</p>
  </div>

  <div class="card">

    <h2>Créer votre compte</h2>

    <p class="subtitle">
      Inscrivez-vous pour accéder à votre espace OSMO.
    </p>

    <div id="error" class="message error"></div>
    <div id="success" class="message success"></div>

    <form id="registerForm">

      <div class="field">
        <label>Pays</label>
        <div class="country">
          Côte d’Ivoire &nbsp; (+225)
        </div>
      </div>

      <div class="field">
        <label for="phone">Numéro de téléphone</label>

        <div class="phone-box">
          <span class="prefix">+225</span>
          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="0700000000"
            autocomplete="tel"
            required
          >
        </div>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>

        <input
          id="password"
          type="password"
          minlength="6"
          placeholder="Minimum 6 caractères"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="passwordConfirm">Confirmer le mot de passe</label>

        <input
          id="passwordConfirm"
          type="password"
          minlength="6"
          placeholder="Confirmez votre mot de passe"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="referral">Code de parrainage — facultatif</label>

        <input
          id="referral"
          type="text"
          maxlength="100"
          placeholder="Code du parrain"
          autocomplete="off"
        >

        <div id="refInfo" class="ref-info"></div>
      </div>

      <button id="submitBtn" type="submit">
        Créer mon compte
      </button>

    </form>

    <div class="login">
      Vous avez déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL =
    "https://ubzcivowwhglvzpyeueg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_KUd51SQCl10pIgztFFGq9Q_Jp1YCK6o";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form = document.getElementById("registerForm");
  const phoneInput = document.getElementById("phone");
  const passwordInput = document.getElementById("password");
  const passwordConfirmInput =
    document.getElementById("passwordConfirm");
  const referralInput =
    document.getElementById("referral");

  const submitBtn =
    document.getElementById("submitBtn");

  const errorBox =
    document.getElementById("error");

  const successBox =
    document.getElementById("success");

  const refInfo =
    document.getElementById("refInfo");


  /*
   * RÉCUPÉRATION AUTOMATIQUE DU PARRAIN
   *
   * Exemple :
   * https://osmo-alpha.vercel.app/?ref=OSMO123
   */
  const params = new URLSearchParams(
    window.location.search
  );

  const referralFromUrl =
    params.get("ref");

  if (referralFromUrl) {

    referralInput.value =
      referralFromUrl.trim();

    refInfo.textContent =
      "Code de parrainage récupéré depuis votre lien d’invitation.";

    referralInput.classList.add("ref-box");
  }


  /*
   * Autoriser uniquement les chiffres
   * pour le numéro ivoirien.
   */
  phoneInput.addEventListener(
    "input",
    () => {
      phoneInput.value =
        phoneInput.value
          .replace(/\D/g, "")
          .slice(0, 10);
    }
  );


  function showError(message) {

    successBox.style.display = "none";

    errorBox.textContent =
      message;

    errorBox.style.display =
      "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function showSuccess(message) {

    errorBox.style.display = "none";

    successBox.textContent =
      message;

    successBox.style.display =
      "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function translateError(error) {

    const message =
      String(error?.message || error || "");

    if (
      message.includes("TELEPHONE_INVALIDE")
    ) {
      return "Le numéro doit contenir exactement 10 chiffres.";
    }

    if (
      message.includes("MOT_DE_PASSE_TROP_COURT")
    ) {
      return "Le mot de passe doit contenir au moins 6 caractères.";
    }

    if (
      message.includes("TELEPHONE_DEJA_UTILISE")
    ) {
      return "Ce numéro de téléphone est déjà utilisé.";
    }

    if (
      message.includes("CODE_PARRAINAGE_INVALIDE")
    ) {
      return "Le code de parrainage est invalide.";
    }

    return "Impossible de créer le compte. Veuillez vérifier les informations.";
  }


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      errorBox.style.display = "none";
      successBox.style.display = "none";

      const phone =
        phoneInput.value.trim();

      const password =
        passwordInput.value;

      const passwordConfirm =
        passwordConfirmInput.value;

      const referralCode =
        referralInput.value.trim();


      if (!/^[0-9]{10}$/.test(phone)) {

        showError(
          "Le numéro ivoirien doit contenir exactement 10 chiffres."
        );

        return;
      }


      if (password.length < 6) {

        showError(
          "Le mot de passe doit contenir au moins 6 caractères."
        );

        return;
      }


      if (password !== passwordConfirm) {

        showError(
          "Les deux mots de passe ne correspondent pas."
        );

        return;
      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "Création du compte...";


      try {

        const {
          data,
          error
        } = await supabaseClient.rpc(
          "register_user_secure",
          {
            p_phone: phone,
            p_password: password,
            p_referral_code:
              referralCode || null
          }
        );


        if (error) {
          throw error;
        }


        /*
         * Le backend renvoie notamment :
         * user_id
         * professional_id
         * phone
         * referral_code
         * balance
         */

        sessionStorage.setItem(
          "osmo_registration",
          JSON.stringify(data)
        );


        showSuccess(
          "Compte créé avec succès. Votre identifiant professionnel est " +
          data.professional_id +
          "."
        );


        form.reset();


        setTimeout(() => {

          window.location.href =
            "connexion.html";

        }, 2500);

      } catch (error) {

        console.error(error);

        showError(
          translateError(error)
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Créer mon compte";
      }
    }
  );
</script>

</body>
</html>
