<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OSMO — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.18), transparent 35%),
        #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .logo-box {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      padding: 4px;
      background: linear-gradient(
        135deg,
        #5b21b6,
        #8b5cf6,
        #4c1d95
      );
      box-shadow:
        0 0 35px rgba(139, 92, 246, 0.25),
        inset 0 0 20px rgba(255,255,255,0.05);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      display: block;
      background: #050505;
    }

    .card {
      background: rgba(13, 13, 15, 0.94);
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 24px;
      padding: 30px 24px 26px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(109, 40, 217, 0.06);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.7px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 600;
    }

    .phone-wrapper {
      display: flex;
      width: 100%;
      height: 54px;
      border: 1px solid #27272a;
      border-radius: 14px;
      background: #09090b;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .phone-wrapper:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.10);
    }

    .prefix {
      width: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a78bfa;
      font-size: 14px;
      font-weight: 700;
      border-right: 1px solid #27272a;
      flex-shrink: 0;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid #27272a;
      border-radius: 14px;
      background: #09090b;
      color: #fff;
      padding: 0 15px;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      transition: 0.2s ease;
    }

    .phone-wrapper input {
      border: 0;
      border-radius: 0;
      height: 52px;
    }

    input::placeholder {
      color: #52525b;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #71717a;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    .toggle-password:hover {
      color: #a78bfa;
    }

    .forgot {
      display: flex;
      justify-content: flex-end;
      margin-top: -5px;
      margin-bottom: 22px;
    }

    .forgot a {
      color: #a78bfa;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .forgot a:hover {
      color: #c4b5fd;
    }

    .submit-btn {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.25);
      transition: 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 35px rgba(124, 58, 237, 0.35);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.20);
    }

    .message.success {
      display: block;
      color: #86efac;
      background: rgba(20, 83, 45, 0.18);
      border: 1px solid rgba(74, 222, 128, 0.20);
    }

    .register {
      text-align: center;
      margin-top: 23px;
      color: #71717a;
      font-size: 13px;
    }

    .register a {
      color: #a78bfa;
      font-weight: 700;
      text-decoration: none;
    }

    .register a:hover {
      color: #c4b5fd;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #3f3f46;
      font-size: 11px;
    }

    @media (max-width: 380px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px 18px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo-container">
      <div class="logo-box">
        <img src="logo.png" alt="OSMO">
      </div>
    </div>

    <section class="card">

      <h1>Se connecter</h1>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="field">
          <label for="phone">Numéro de téléphone</label>

          <div class="phone-wrapper">
            <div class="prefix">+225</div>

            <input
              type="tel"
              id="phone"
              name="phone"
              inputmode="numeric"
              maxlength="10"
              pattern="[0-9]{10}"
              placeholder="XXXXXXXXXX"
              autocomplete="tel"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              Afficher
            </button>
          </div>
        </div>

        <div class="forgot">
          <a href="mot-de-passe-oublie.html">
            Mot de passe oublié ?
          </a>
        </div>

        <button
          type="submit"
          class="submit-btn"
          id="loginBtn"
        >
          Se connecter
        </button>

      </form>

      <div class="register">
        Vous n'avez pas encore de compte ?
        <a href="index.html">Créer un compte</a>
      </div>

    </section>

    <div class="footer">
      OSMO
    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://ubzcivowwhglvzpyeueg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oPjQfIoZzfv1LuLAfsua4g_97K_tXSO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const form = document.getElementById("loginForm");
    const phoneInput = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    phoneInput.addEventListener("input", () => {
      phoneInput.value = phoneInput.value
        .replace(/\D/g, "")
        .slice(0, 10);
    });

    togglePassword.addEventListener("click", () => {
      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      togglePassword.textContent =
        isPassword ? "Masquer" : "Afficher";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      clearMessage();

      const phone = phoneInput.value.trim();
      const password = passwordInput.value;

      if (!/^[0-9]{10}$/.test(phone)) {
        showMessage(
          "Veuillez entrer un numéro ivoirien valide de 10 chiffres."
        );
        phoneInput.focus();
        return;
      }

      if (!password) {
        showMessage(
          "Veuillez entrer votre mot de passe."
        );
        passwordInput.focus();
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Connexion...";

      try {

        const { data, error } =
          await supabaseClient.rpc(
            "login_user_secure",
            {
              p_phone: phone,
              p_password: password
            }
          );

        if (error) {
          console.error(error);

          showMessage(
            "Une erreur est survenue. Vérifiez vos identifiants."
          );

          return;
        }

        if (!data) {
          showMessage(
            "Numéro ou mot de passe incorrect."
          );

          return;
        }

        /*
         * La fonction RPC doit retourner
         * les informations de connexion.
         */

        if (data.success === false) {
          showMessage(
            data.message ||
            "Numéro ou mot de passe incorrect."
          );

          return;
        }

        /*
         * On conserve les informations de session
         * nécessaires au fonctionnement du dashboard.
         */

        if (data.session_token) {
          localStorage.setItem(
            "osmo_session_token",
            data.session_token
          );
        }

        if (data.user_id) {
          localStorage.setItem(
            "osmo_user_id",
            data.user_id
          );
        }

        if (data.professional_id) {
          localStorage.setItem(
            "osmo_professional_id",
            data.professional_id
          );
        }

        if (data.phone) {
          localStorage.setItem(
            "osmo_phone",
            data.phone
          );
        }

        showMessage(
          "Connexion réussie. Redirection...",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "dashboard.html";
        }, 700);

      } catch (error) {

        console.error(error);

        showMessage(
          "Impossible de se connecter pour le moment."
        );

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Se connecter";

      }
    });
  </script>

</body>
  </html>
